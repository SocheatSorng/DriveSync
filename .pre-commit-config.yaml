# Runs on your PC before every `git commit` (once per clone: uv run pre-commit install).
# Blocks commits that contain secrets (credentials.json / token.json content), lint errors,
# insecure code or unsafe workflow changes - before they ever reach GitHub.
# Update hook versions with: uv run pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^(drive_sync|tray_app|gui|accounts|browsers|watcher|activity|activity_view|twoway|progress)\.py$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      - id: uv-lock          # keep uv.lock in sync with pyproject.toml
      - id: uv-export        # keep requirements.txt in sync with uv.lock
        args: ["--no-dev", "--no-emit-project", "--quiet", "-o", "requirements.txt"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-json
      - id: check-yaml
