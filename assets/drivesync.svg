<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1200 1000">
  <!-- The Drive Sync logo: a folder (blue, this PC) folding into a cloud (green, Google Drive),
       joined by a yellow fold: the three colors of Google Drive.
       logo.py draws the same shapes with Pillow; keep the two in step. -->
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2684FC"/>
      <stop offset="1" stop-color="#0066DA"/>
    </linearGradient>
    <linearGradient id="green" x1="0.05" y1="0.95" x2="0.95" y2="0.05">
      <stop offset="0" stop-color="#00832D"/>
      <stop offset="1" stop-color="#00AC47"/>
    </linearGradient>
    <clipPath id="folderClip">
      <path d="M180 0 C92 0 30 56 30 145 L30 850 C30 940 82 1000 180 1000 L820 1000
               C1040 1000 1190 850 1190 650 C1190 552 1147 472 1100 420
               C1085 286 1000 220 875 220 L650 220 C580 220 550 0 430 0 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#folderClip)">
    <rect x="0" y="0" width="1200" height="1000" fill="url(#blue)"/>
    <path d="M78 1000 L650 220 L875 220 C1000 220 1085 286 1100 420 C1147 472 1190 552 1190 650
             C1190 850 1040 1000 820 1000 Z" fill="url(#green)"/>
    <path d="M78 1000 L650 220" fill="none" stroke="#FFBA00" stroke-width="56" stroke-linecap="round"/>
    <path d="M30 145 C30 56 92 0 180 0" fill="none" stroke="#8CBEFF" stroke-width="8" opacity="0.48"/>
  </g>
</svg>
