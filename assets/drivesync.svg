<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
  <!-- The Drive Sync logo, "Glasslight": a blue folder (this PC) folding into a green cloud
       (Google Drive), joined by a glowing yellow fold. logo.py draws the same shapes with Pillow
       (PALETTES["glass"]); keep the two in step. -->
<defs>
<linearGradient id="b" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#2EC5FF"/><stop offset="1" stop-color="#0755C8"/></linearGradient>
<linearGradient id="g" x1=".05" y1=".95" x2=".95" y2=".05"><stop stop-color="#00A56B"/><stop offset="1" stop-color="#5BFFC0"/></linearGradient>
<linearGradient id="y" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#FFAA22"/><stop offset=".48" stop-color="#FFF7A0"/><stop offset="1" stop-color="#FFAA22"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".36"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="c"><path d="M180 0 C92 0 30 56 30 145 L30 850 C30 940 82 1000 180 1000 L820 1000 C1040 1000 1190 850 1190 650 C1190 552 1147 472 1100 420 C1085 286 1000 220 875 220 L650 220 C580 220 550 0 430 0 Z"/></clipPath></defs>
<g clip-path="url(#c)">
<rect width="1200" height="1000" fill="url(#b)"/>
<rect width="1200" height="1000" fill="url(#shine)"/>
<path d="M78 1000 L650 220 L875 220 C1000 220 1085 286 1100 420 C1147 472 1190 552 1190 650 C1190 850 1040 1000 820 1000 Z" fill="url(#g)"/>
<path d="M78 1000 L650 220 L875 220 C1000 220 1085 286 1100 420 C1147 472 1190 552 1190 650 C1190 850 1040 1000 820 1000 Z" fill="url(#shine)" opacity=".85"/>
<path d="M92 982 L650 220" fill="none" stroke="#003D65" stroke-opacity=".28" stroke-width="76" stroke-linecap="round"/>
<path d="M78 1000 L650 220" fill="none" stroke="url(#y)" stroke-width="48" stroke-linecap="round"/>
<path d="M78 1000 L650 220" fill="none" stroke="#FFF9D5" stroke-opacity=".72" stroke-width="7" stroke-linecap="round"/>
<path d="M180 12 C104 12 43 64 42 145" fill="none" stroke="#C4F2FF" stroke-width="13" stroke-linecap="round"/>
</g><path d="M180 0 C92 0 30 56 30 145 L30 850 C30 940 82 1000 180 1000 L820 1000 C1040 1000 1190 850 1190 650 C1190 552 1147 472 1100 420 C1085 286 1000 220 875 220 L650 220 C580 220 550 0 430 0 Z" fill="none" stroke="#C4F2FF" stroke-width="15" stroke-linejoin="round"/></svg>
